[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orbital-mission-framework"
version = "0.1.0"
description = "Unified mission planning and simulation framework for UAV and CubeSat operations."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Rebecca Shillingford" }
]

dependencies = [
  "numpy>=1.24",
  "PyYAML>=6.0",
  "matplotlib>=3.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "black>=23.0",
  "ruff>=0.1.0",
  "mypy>=1.5"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["mission_framework*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
