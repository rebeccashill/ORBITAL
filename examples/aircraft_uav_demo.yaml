# examples/aircraft_uav_demo.yaml
#
# Aircraft UAV Mission Demo
# --------------------------
# This scenario defines:
# - Waypoints to visit
# - Wind model
# - Energy constraints
# - Maneuver limits
# - Geofencing
# - Optimization objective
# - Robustness configuration
#
# The CLI should parse this YAML and build:
# - Decision variables
# - Constraints
# - Objective
# - Problem instance
# - Planner configuration

scenario:
  name: "UAV Multi-Waypoint Mission Demo"
  type: "aircraft"

# ------------------------------------------------------------
# Initial Conditions
# ------------------------------------------------------------
initial_state:
  x_m: 0.0
  y_m: 0.0
  heading_rad: 0.0
  speed_mps: 20.0
  battery_Wh: 800.0

# ------------------------------------------------------------
# Waypoints (must be visited)
# ------------------------------------------------------------
mission:
  waypoints:
    - id: "WP1"
      x_m: 2000.0
      y_m: 1000.0
    - id: "WP2"
      x_m: 3500.0
      y_m: -500.0
    - id: "WP3"
      x_m: 5000.0
      y_m: 2000.0

# ------------------------------------------------------------
# Vehicle Model Parameters
# ------------------------------------------------------------
vehicle:
  dt_s: 5.0
  reach_radius_m: 75.0
  mass_kg: 12.0
  cruise_speed_mps: 22.0
  max_speed_mps: 30.0
  min_speed_mps: 12.0
  max_turn_rate_radps: 0.35
  battery_capacity_Wh: 800.0
  energy_rate_cruise_W: 450.0
  energy_rate_turn_W: 550.0


# ------------------------------------------------------------
# Wind Model
# ------------------------------------------------------------
wind:
  type: "sinusoidal"
  base_speed_mps: 5.0
  direction_rad: 1.2
  gust_amplitude_mps: 2.0
  gust_frequency_hz: 0.005

# ------------------------------------------------------------
# Geofencing
# ------------------------------------------------------------
geofence:
  no_fly_zones:
    - id: "NFZ1"
      polygon:
        - [2500.0, 0.0]
        - [3000.0, 0.0]
        - [3000.0, 800.0]
        - [2500.0, 800.0]

# ------------------------------------------------------------
# Constraints
# ------------------------------------------------------------
constraints:
  enforce_waypoint_visit: true
  enforce_geofence: true
  enforce_energy_nonnegative: true
  enforce_turn_rate_limit: true
  enforce_speed_limits: true

# ------------------------------------------------------------
# Objective
# ------------------------------------------------------------
objective:
  type: "weighted_sum"
  terms:
    - name: "total_time"
      weight: 1.0
      mode: "minimize"
    - name: "energy_used"
      weight: 0.3
      mode: "minimize"

# ------------------------------------------------------------
# Planner Configuration
# ------------------------------------------------------------
planner:
  iterations: 200
  restarts: 1
  penalty_weight: 2000.0
  hard_infeasible_penalty: 1000000.0
  mutation:
    cont_sigma: 0.15
    int_step: 1
    p_flip: 0.05
    p_perm_swap: 0.5
    perm_swaps: 2
  seed: 42
  stop_if_feasible_for: 50


# ------------------------------------------------------------
# Robustness / Monte Carlo
# ------------------------------------------------------------
robustness:
  cases: 20
  wind_scale_range: [0.8, 1.2]
  battery_variation_pct: 0.05
  report_percentiles: [50, 90]

# ------------------------------------------------------------
# Output Configuration
# ------------------------------------------------------------
output:
  save_history: false
  export_flight_path: true
  export_constraint_report: true
  export_summary_metrics: true
  verbose: true

simulation:
  stall_time_s: 900
  stall_improve_m: 0.0
  k_heading: 0.6
  k_speed: 0.6