# Stress Case A (Aircraft): High wind + stronger gusts
scenario:
  name: "UAV Stress - High Wind & Gusts"
  type: "aircraft"

initial_state:
  x_m: 0.0
  y_m: 0.0
  heading_rad: 0.0
  speed_mps: 20.0
  battery_Wh: 800.0

mission:
  waypoints:
    - id: "WP1"
      x_m: 2000.0
      y_m: 1000.0
    - id: "WP2"
      x_m: 3500.0
      y_m: -500.0
    - id: "WP3"
      x_m: 5000.0
      y_m: 2000.0

vehicle:
  dt_s: 5.0
  reach_radius_m: 75.0
  mass_kg: 12.0
  cruise_speed_mps: 22.0
  max_speed_mps: 30.0
  min_speed_mps: 12.0
  max_turn_rate_radps: 0.35
  battery_capacity_Wh: 800.0
  energy_rate_cruise_W: 450.0
  energy_rate_turn_W: 550.0

wind:
  type: "sinusoidal"
  base_speed_mps: 12.0
  direction_rad: 1.2
  gust_amplitude_mps: 8.0
  gust_frequency_hz: 0.01

geofence:
  no_fly_zones:
    - id: "NFZ1"
      polygon:
        - [2500.0, 0.0]
        - [3000.0, 0.0]
        - [3000.0, 800.0]
        - [2500.0, 800.0]

constraints:
  enforce_waypoint_visit: true
  enforce_geofence: true
  enforce_energy_nonnegative: true
  enforce_turn_rate_limit: true
  enforce_speed_limits: true

objective:
  type: "weighted_sum"
  terms:
    - name: "total_time"
      weight: 1.0
      mode: "minimize"
    - name: "energy_used"
      weight: 0.3
      mode: "minimize"

planner:
  iterations: 400
  restarts: 2
  penalty_weight: 2000.0
  hard_infeasible_penalty: 1000000.0
  mutation:
    cont_sigma: 0.15
    int_step: 1
    p_flip: 0.05
    p_perm_swap: 0.5
    perm_swaps: 2
  seed: 42
  stop_if_feasible_for: 80

robustness:
  cases: 30
  wind_scale_range: [1.2, 1.7]
  battery_variation_pct: 0.05
  report_percentiles: [50, 90]

output:
  save_history: false
  export_flight_path: true
  export_constraint_report: true
  export_summary_metrics: true
  verbose: true

simulation:
  stall_time_s: 900
  stall_improve_m: 0.0
  k_heading: 0.6
  k_speed: 0.6